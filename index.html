<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>認識 1-20：十格框大挑戰</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --secondary-color: #FF9F43;
            --success-color: #2ECC71;
            --bg-color: #FFF9E6;
            --frame-bg: #FFF3CD;
            --dot-color-1: #9B59B6; /* 1-5 紫色 */
            --dot-color-2: #2ECC71; /* 6-20 綠色 */
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang TC', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 20px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            background: #EBF5FB;
            padding: 10px 15px;
            border-radius: 12px;
        }

        .frames-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin: 15px 0;
            touch-action: none;
            user-select: none;
        }

        .ten-frame {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px;
            background-color: var(--frame-bg);
            border: 3px solid #F39C12;
            border-radius: 10px;
            padding: 6px;
            width: 100%;
            max-width: 320px;
            height: 130px;
        }

        .cell {
            background: white;
            border: 2px dashed #F39C12;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }

        .dot {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.1s ease;
        }

        .dot.purple { background-color: var(--dot-color-1); }
        .dot.green { background-color: var(--dot-color-2); }

        /* 網頁自訂數字鍵盤樣式 */
        .keypad-display-box {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
            background: #F4F6F7;
            padding: 8px;
            border-radius: 10px;
            border: 2px solid #BDC3C7;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 280px;
            margin: 0 auto 10px auto;
        }

        .num-btn {
            background-color: #3498DB;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            padding: 12px 0;
            border-radius: 12px;
            box-shadow: 0 4px 0 #2980B9;
            cursor: pointer;
        }

        .num-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .num-btn.clear { background-color: #E74C3C; box-shadow: 0 4px 0 #C0392B; }
        .num-btn.submit { background-color: var(--success-color); box-shadow: 0 4px 0 #27AE60; }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 0 #E67E22;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

       .feedback {
    min-height: 55px;
    margin: 10px 0;
    font-size: 1.05rem;
    font-weight: bold;
    color: #D35400;
    line-height: 1.6; /* 加大行高，讓閱讀更舒適 */
    background-color: #FDEDEC;
    border-radius: 12px;
    padding: 12px 15px;
    text-align: center; /* 讓文字與圖示置中 */
    display: block;    /* 關鍵修復：改回區塊排版，讓文字與 <b> 標籤自然流動 */
    box-sizing: border-box;
}

.feedback.empty {
    background-color: transparent;
    padding: 0;
}

/* 提示內的獨立段落排版，確保引導字眼結構清晰 */
.feedback-title {
    color: #E67E22;
    font-size: 1.1rem;
    margin-bottom: 4px;
}

.feedback-hint {
    color: #5D4037;
    font-weight: normal;
    font-size: 0.98rem;
}
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #DDD;
            padding: 8px;
            text-align: center;
        }

        th { background-color: var(--primary-color); color: white; }

        .form-group { margin: 10px 0; text-align: left; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #CCC;
            border-radius: 8px;
            font-size: 1rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="card">
    <!-- 1. 開始畫面 -->
    <div id="start-screen">
        <h1>認識 1 - 20<br>十格框大挑戰 🎯</h1>
        <p style="color: #555; line-height: 1.5;">手指滑一滑，大腦變聰明！<br>挑戰 40 秒能獲得多少分？</p>
        <button class="btn" onclick="startGame()">開始挑戰</button>
    </div>

    <!-- 2. 遊戲進行畫面 -->
    <div id="game-screen" class="hidden">
        <div class="header">
            <span>⏳ 時間: <span id="timer">40</span>s</span>
            <span>🔥 連對: <span id="streak">0</span></span>
            <span>⭐ 分數: <span id="score">0</span></span>
        </div>

        <div id="question-text" style="font-size: 1.2rem; font-weight: bold;"></div>

        <div class="frames-wrapper" id="frames-container"></div>

        <div id="interactive-area"></div>

        <div id="feedback" class="feedback empty"></div>
    </div>

    <!-- 3. 結算畫面 -->
    <div id="end-screen" class="hidden">
        <h2>時間到！挑戰成功！🌟</h2>
        <p>最終得分：<span id="final-score" style="font-size: 1.6rem; color: var(--secondary-color); font-weight: bold;">0</span> 分</p>
        <p>最高連續答對：<span id="final-streak" style="font-weight: bold; color: var(--success-color);">0</span> 題</p>
        
        <form id="score-form" onsubmit="submitScore(event)">
            <div class="form-group">
                <label for="class-name">班別 (例如: 1A):</label>
                <input type="text" id="class-name" required placeholder="請輸入班別">
            </div>
            <div class="form-group">
                <label for="student-name">姓名:</label>
                <input type="text" id="student-name" required placeholder="請輸入姓名">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">登錄龍虎榜</button>
        </form>
    </div>

    <!-- 4. 龍虎榜畫面 -->
    <div id="leaderboard-screen" class="hidden">
        <h2>🏆 龍虎榜 (頭十名)</h2>
        <div id="leaderboard-status">正在讀取最高紀錄...</div>
        <table id="leaderboard-table" class="hidden">
            <thead>
                <tr>
                    <th>排名</th>
                    <th>班別</th>
                    <th>姓名</th>
                    <th>最高分數</th>
                    <th>最高連對</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
        <br>
        <!-- 重新開始按鈕：初始隱藏，龍虎榜載入完成後才顯示 -->
        <button id="restart-btn" class="btn hidden" onclick="restartGame()">重新開始</button>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzHpZVe5k3PrTSq4VELWVDQyoY6xbTgE74YTmzBGuSqdrLzYOk_PwhWj70p0y043srQFQ/exec";

    let score = 0;
    let streak = 0;
    let maxStreak = 0;
    let timeLeft = 40;
    let timerInterval = null;
    let currentTarget = 0;
    let currentType = 1;
    let userDots = 0;
    let keypadInputValue = "";

    let isSwipeInitialized = false;
    let isDragging = false;
    let dragAction = 'add'; 

    function startGame() {
        score = 0;
        streak = 0;
        maxStreak = 0;
        timeLeft = 40;
        document.getElementById('score').innerText = score;
        document.getElementById('streak').innerText = streak;
        document.getElementById('timer').innerText = timeLeft;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('leaderboard-screen').classList.add('hidden');
        document.getElementById('restart-btn').classList.add('hidden'); // 重置按鈕隱藏
        document.getElementById('game-screen').classList.remove('hidden');

        setupSwipeInteraction();
        nextQuestion();

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function generateTarget() {
        return Math.floor(Math.random() * 20) + 1;
    }

    function nextQuestion() {
        setFeedback('');
        keypadInputValue = "";
        currentTarget = generateTarget();
        currentType = Math.random() < 0.5 ? 1 : 2;

        const container = document.getElementById('frames-container');
        const interactive = document.getElementById('interactive-area');
        container.innerHTML = '';
        interactive.innerHTML = '';

        if (currentType === 1) {
            document.getElementById('question-text').innerText = "上圖共有圓點幾粒？";
            const frameCount = currentTarget > 10 ? 2 : 1;
            renderFrames(container, frameCount, currentTarget, false);

            // 題型一：直接嵌入網頁數字鍵盤，無需點擊輸入框
            interactive.innerHTML = `
                <div class="keypad-display-box">答案：<span id="keypad-display" style="color:var(--primary-color);">?</span> 粒</div>
                <div class="keypad-grid">
                    <button class="num-btn" onclick="pressKey('1')">1</button>
                    <button class="num-btn" onclick="pressKey('2')">2</button>
                    <button class="num-btn" onclick="pressKey('3')">3</button>
                    <button class="num-btn" onclick="pressKey('4')">4</button>
                    <button class="num-btn" onclick="pressKey('5')">5</button>
                    <button class="num-btn" onclick="pressKey('6')">6</button>
                    <button class="num-btn" onclick="pressKey('7')">7</button>
                    <button class="num-btn" onclick="pressKey('8')">8</button>
                    <button class="num-btn" onclick="pressKey('9')">9</button>
                    <button class="num-btn clear" onclick="pressKey('clear')">⌫</button>
                    <button class="num-btn" onclick="pressKey('0')">0</button>
                    <button class="num-btn submit" onclick="checkType1Answer()">✓</button>
                </div>
            `;
        } else {
            const frameCount = currentTarget > 10 ? 2 : 1;
            document.getElementById('question-text').innerHTML = `請在十格框劃過或點擊，放上 <span style="color:var(--secondary-color); font-size:1.5rem;">${currentTarget}</span> 個圓點：`;
            userDots = 0;
            renderFrames(container, frameCount, 0, true);

            interactive.innerHTML = `<button class="btn" onclick="checkType2Answer()">提交答案</button>`;
        }
    }

    /* 網頁數字鍵盤按鈕觸發邏輯 */
    function pressKey(key) {
        if (key === 'clear') {
            keypadInputValue = "";
        } else {
            if (keypadInputValue.length < 2) { // 答案最高 20，最多兩位數
                keypadInputValue += key;
            }
        }
        const display = document.getElementById('keypad-display');
        if (display) {
            display.innerText = keypadInputValue === "" ? "?" : keypadInputValue;
        }
    }

    function renderFrames(container, frameCount, filledDots, isInteractive) {
        let remainingDots = filledDots;

        for (let f = 0; f < frameCount; f++) {
            const frame = document.createElement('div');
            frame.className = 'ten-frame';

            for (let i = 0; i < 10; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';

                if (!isInteractive && remainingDots > 0) {
                    const dot = document.createElement('div');
                    const colorClass = filledDots <= 5 ? 'purple' : 'green';
                    dot.className = `dot ${colorClass}`;
                    cell.appendChild(dot);
                    remainingDots--;
                }
                frame.appendChild(cell);
            }
            container.appendChild(frame);
        }
    }

    function setupSwipeInteraction() {
        if (isSwipeInitialized) return;
        isSwipeInitialized = true;

        const container = document.getElementById('frames-container');

        const handleStart = (e) => {
            if (currentType !== 2) return;
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const cell = getCellFromPoint(clientX, clientY);
            if (cell) {
                dragAction = cell.hasChildNodes() ? 'remove' : 'add';
                applyDotState(cell, dragAction);
            }
        };

        const handleMove = (e) => {
            if (!isDragging || currentType !== 2) return;
            if (e.cancelable) e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const cell = getCellFromPoint(clientX, clientY);
            if (cell) {
                applyDotState(cell, dragAction);
            }
        };

        const handleEnd = () => { isDragging = false; };

        container.addEventListener('mousedown', handleStart);
        container.addEventListener('mousemove', handleMove);
        container.addEventListener('touchstart', handleStart, { passive: false });
        container.addEventListener('touchmove', handleMove, { passive: false });

        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchcancel', handleEnd);
    }

    function getCellFromPoint(x, y) {
        const elem = document.elementFromPoint(x, y);
        if (!elem) return null;
        if (elem.classList.contains('cell')) return elem;
        if (elem.classList.contains('dot')) return elem.parentElement;
        return null;
    }

    function applyDotState(cell, action) {
        if (action === 'add' && !cell.hasChildNodes()) {
            const dot = document.createElement('div');
            const colorClass = currentTarget <= 5 ? 'purple' : 'green';
            dot.className = `dot ${colorClass}`;
            cell.appendChild(dot);
            userDots++;
        } else if (action === 'remove' && cell.hasChildNodes()) {
            cell.innerHTML = '';
            userDots--;
        }
    }

    function checkType1Answer() {
        const ans = parseInt(keypadInputValue, 10);
        if (ans === currentTarget) {
            handleCorrect();
        } else {
            handleWrong(explainType1Error(ans, currentTarget));
        }
    }

    function checkType2Answer() {
        if (userDots === currentTarget) {
            handleCorrect();
        } else {
            handleWrong(explainType2Error(userDots, currentTarget));
        }
    }

    function handleCorrect() {
        score += 5;
        streak += 1;
        if (streak > maxStreak) maxStreak = streak;

        document.getElementById('score').innerText = score;
        document.getElementById('streak').innerText = streak;
        nextQuestion();
    }

    function handleWrong(msg) {
        streak = 0;
        document.getElementById('streak').innerText = streak;
        setFeedback(msg);
    }

    function setFeedback(msg) {
        const fb = document.getElementById('feedback');
        if (!msg) {
            fb.innerText = '';
            fb.classList.add('empty');
        } else {
            fb.innerHTML = msg;
            fb.classList.remove('empty');
        }
    }

function explainType1Error(userAns, correctAns) {
    if (isNaN(userAns)) return "<div class='feedback-title'>💪 沒關係，我們再試一次！</div><div class='feedback-hint'>請按數字鍵盤輸入答案喔！</div>";
    
    let title = "<div class='feedback-title'>🌱 大腦正在變聰明！做錯是學習的好機會！</div>";
    let hint = "";

    if (correctAns > 10) {
        hint = `<div class='feedback-hint'>💡 <b>思考小幫手：</b>滿格十格框是 <b>10</b>，另一個框有 <b>${correctAns - 10}</b> 個，合起來就是 <b>${correctAns}</b> 喔！</div>`;
    } else if (correctAns > 5) {
        hint = `<div class='feedback-hint'>💡 <b>思考小幫手：</b>第一排滿格是 <b>5</b>，接著往後數數看：6、7...</div>`;
    } else {
        hint = `<div class='feedback-hint'>💡 <b>思考小幫手：</b>伸出小手指，跟著十格框一個一個數數看！</div>`;
    }
    
    return title + hint;
}

function explainType2Error(current, target) {
    let title = "<div class='feedback-title'>🌟 很有嘗試的精神！我們離正確答案越來越近了！</div>";
    let hint = "";

    if (current < target) {
        hint = `<div class='feedback-hint'>你現在放了 <b>${current}</b> 個圓點，還少 <b>${target - current}</b> 個，再滑過幾格補齊吧！</div>`;
    } else {
        hint = `<div class='feedback-hint'>你現在放了 <b>${current}</b> 個圓點，多放了 <b>${current - target}</b> 個，再劃過多餘的圓點就能拿掉囉！</div>`;
    }
    return title + hint;
}

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-streak').innerText = maxStreak;
    }

    function submitScore(e) {
        e.preventDefault();
        const className = document.getElementById('class-name').value.trim();
        const studentName = document.getElementById('student-name').value.trim();

        if (!className || !studentName) return;

        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('leaderboard-screen').classList.remove('hidden');

        if (GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") {
            document.getElementById('leaderboard-status').innerText = "（目前為測試模式，顯示範例數據）";
            showMockLeaderboard(className, studentName, score, maxStreak);
            return;
        }

        document.getElementById('leaderboard-status').innerText = "正在記錄成績，大腦又變聰明囉...";

        fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
                className: className,
                studentName: studentName,
                score: score,
                maxStreak: maxStreak
            })
        })
        .then(() => loadLeaderboard())
        .catch((err) => {
            console.error("寫入錯誤:", err);
            loadLeaderboard();
        });
    }

    function loadLeaderboard() {
        document.getElementById('leaderboard-status').innerText = "正在更新最新龍虎榜...";
        fetch(GAS_URL)
            .then(res => res.json())
            .then(data => renderLeaderboard(data))
            .catch(() => {
                document.getElementById('leaderboard-status').innerText = "讀取龍虎榜失敗，請重新整理。";
            });
    }

    function renderLeaderboard(data) {
        document.getElementById('leaderboard-status').innerText = "";
        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = '';

        data.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${escapeHtml(item.className)}</td>
                <td>${escapeHtml(item.studentName)}</td>
                <td>${item.score}</td>
                <td>${item.maxStreak}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('leaderboard-table').classList.remove('hidden');
        // 關鍵：載入完成並渲染後，才顯示「重新開始」按鈕
        document.getElementById('restart-btn').classList.remove('hidden');
    }

    function showMockLeaderboard(cls, name, sc, stk) {
        renderLeaderboard([
            { className: cls, studentName: name, score: sc, maxStreak: stk },
            { className: "1A", studentName: "李小明", score: 30, maxStreak: 6 }
        ]);
    }

    function restartGame() {
        startGame();
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
</script>
</body>
</html>
